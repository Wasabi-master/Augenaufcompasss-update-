<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Augen Auf Compass</title>

<style>
body{
  margin:0;
  background:#0b1220;
  color:#e5e7eb;
  font-family:system-ui, -apple-system, sans-serif;
}

/* Header */
header{
  text-align:center;
  padding:20px;
  font-size:22px;
  background:#0f172a;
}

/* Layout */
.container{
  padding:20px;
  max-width:800px;
  margin:auto;
}

/* Buttons */
button{
  width:100%;
  padding:16px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#1f2937;
  color:white;
  font-size:18px;
}

/* Compass */
.compass{
  width:240px;
  height:240px;
  border-radius:50%;
  margin:30px auto;
  border:3px solid #374151;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;

  background:radial-gradient(circle, #111827 40%, #020617);
  box-shadow:inset 0 0 20px rgba(255,255,255,0.05);
}

/* Neuer schöner Pfeil */
.arrow{
  position:relative;
  width:0;
  height:0;
  border-left:20px solid transparent;
  border-right:20px solid transparent;
  border-bottom:100px solid #38bdf8;
  filter:drop-shadow(0 0 10px rgba(56,189,248,0.6));
  transform-origin:center;
  transition:transform 0.15s linear;
}

.arrow::after{
  content:"";
  position:absolute;
  top:85px;
  left:-10px;
  width:20px;
  height:20px;
  background:#38bdf8;
  border-radius:50%;
  box-shadow:0 0 10px rgba(56,189,248,0.8);
}

/* Popup */
.popup{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111827;
  padding:25px;
  border-radius:25px 25px 0 0;
}

/* Text */
.big{
  font-size:20px;
}

.small{
  font-size:16px;
  color:#9ca3af;
}
</style>
</head>

<body>

<header>Augen Auf Compass</header>

<div class="container">

<button onclick="start()">Start Navigation</button>

<div class="compass">
  <div class="arrow" id="arrow"></div>
</div>

<div id="status" class="big"></div>
<div id="debug" class="small"></div>

<div style="margin-top:15px;font-size:20px">
Lösungswort: <b id="word"></b>
</div>

</div>

<div id="popup"></div>

<script>

let userPos=null;
let heading=0;
let solution="";
let currentStation=null;
let showQuestion=false;

let saved = JSON.parse(localStorage.getItem("progress")||"[]");

const points=[
{lat:51.3733,lng:7.6937,info:"Dieses Mahnmal erinnert an eine Zeit der Verfolgung.",q:"Woran erinnert das Mahnmal?",a:"B",l:"D"},
{lat:51.3734,lng:7.6956,info:"Menschen suchten Schutz vor Bomben.",q:"Wozu dienten Luftschutzstollen?",a:"B",l:"E"},
{lat:51.3743,lng:7.6976,info:"Kleine Steine erinnern an Menschen.",q:"Was sind Stolpersteine?",a:"B",l:"M"},
{lat:51.3745,lng:7.6978,info:"Geschäfte wurden zerstört.",q:"Was geschah mit jüdischen Geschäften?",a:"A",l:"O"},
{lat:51.3749,lng:7.6982,info:"Menschen wurden wegen ihrer Herkunft verfolgt.",q:"Warum wurden Familien verfolgt?",a:"A",l:"K"},
{lat:51.3743,lng:7.6990,info:"Erinnerung an Opfer.",q:"Woran erinnern Gedenktafeln?",a:"C",l:"R"},
{lat:51.3742,lng:7.6995,info:"Jeder Stein steht für ein Leben.",q:"Was symbolisieren Stolpersteine?",a:"B",l:"A"},
{lat:51.3745,lng:7.7040,info:"Religiöse Gebäude wurden zerstört.",q:"Was geschah mit Synagogen?",a:"B",l:"T"},
{lat:51.3759,lng:7.7099,info:"Erinnerung macht Geschichte greifbar.",q:"Warum ist Erinnern wichtig?",a:"A",l:"I"},
{lat:51.3748,lng:7.7106,info:"Lehren für heute.",q:"Was ist eine wichtige Lehre?",a:"B",l:"E"}
];

const answers=[
{A:"Wiederaufbau",B:"NS-Opfer",C:"Händler"},
{A:"Treffpunkte",B:"Schutzräume",C:"Lager"},
{A:"Steine",B:"Gedenksteine",C:"Kunst"},
{A:"Zerstört",B:"Gefördert",C:"Unverändert"},
{A:"Religion",B:"Beruf",C:"Wohnort"},
{A:"Sport",B:"Künstler",C:"Verfolgung"},
{A:"Städte",B:"Schicksale",C:"Gebäude"},
{A:"Erweitert",B:"Zerstört",C:"Museen"},
{A:"Greifbar",B:"Sammeln",C:"Straßen"},
{A:"Vergessen",B:"Demokratie schützen",C:"Vergangenheit"}
];

function distance(a,b){
const R=6371000;
const dLat=(b.lat-a.lat)*Math.PI/180;
const dLng=(b.lng-a.lng)*Math.PI/180;
const x=Math.sin(dLat/2)**2+
Math.cos(a.lat*Math.PI/180)*
Math.cos(b.lat*Math.PI/180)*
Math.sin(dLng/2)**2;
return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)));
}

function angle(a,b){
const y=Math.sin((b.lng-a.lng)*Math.PI/180)*Math.cos(b.lat*Math.PI/180);
const x=Math.cos(a.lat*Math.PI/180)*Math.sin(b.lat*Math.PI/180)-
Math.sin(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*
Math.cos((b.lng-a.lng)*Math.PI/180);
return (Math.atan2(y,x)*180/Math.PI+360)%360;
}

function getDirection(deg){
const dirs=["Norden","Nord-Ost","Osten","Süd-Ost","Süden","Süd-West","Westen","Nord-West"];
return dirs[Math.round(deg/45)%8];
}

async function start(){

if(typeof DeviceOrientationEvent!=="undefined" &&
typeof DeviceOrientationEvent.requestPermission==="function"){
await DeviceOrientationEvent.requestPermission();
}

navigator.geolocation.watchPosition(p=>{
userPos={lat:p.coords.latitude,lng:p.coords.longitude};
update();
});

window.addEventListener("deviceorientation",e=>{
if(e.alpha!==null){
heading=e.webkitCompassHeading||e.alpha;
updateCompass();
}
});
}

function updateCompass(){
let next=getNext();
if(!userPos||!next)return;

let rot=angle(userPos,next)-heading;
document.getElementById("arrow").style.transform=`rotate(${rot}deg)`;
}

function getNext(){
return points.find((p,i)=>!saved.includes(i));
}

function update(){
let next=getNext();

if(userPos && next){
let d=distance(userPos,next);
let dir=getDirection(angle(userPos,next));

document.getElementById("status").innerHTML =
"Gehe nach <b>"+dir+"</b> ("+d+" m)";

if(d<100 && currentStation===null){
currentStation=next;
showQuestion=false;
showPopup(next);
}
}

solution = saved.map(i=>points[i].l).join("");
document.getElementById("word").innerText=solution;

document.getElementById("debug").innerText =
userPos ? "GPS aktiv" : "Kein GPS";
}

function showPopup(p){
let i=points.indexOf(p);

let html="<div class='popup'>";

if(!showQuestion){
html+="<h2>Station "+(i+1)+"</h2>";
html+="<p>"+p.info+"</p>";
html+="<button onclick='showQuestion=true;showPopup(points["+i+"])'>Frage anzeigen</button>";
}else{
html+="<h2>Frage</h2>";
html+="<p>"+p.q+"</p>";

for(let k in answers[i]){
html+="<button onclick=\"answer("+i+",'"+k+"')\">"+k+") "+answers[i][k]+"</button>";
}
}

html+="</div>";

document.getElementById("popup").innerHTML=html;
}

function answer(i,val){
if(points[i].a===val){
saved.push(i);
localStorage.setItem("progress",JSON.stringify(saved));

document.getElementById("popup").innerHTML="";
currentStation=null;
update();
}else{
alert("Falsch");
}
}

update();

</script>

</body>
</html>
